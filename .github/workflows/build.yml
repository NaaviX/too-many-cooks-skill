name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The agent-skills platform writes tracked artifacts at the repo root
      # (skills/toomanycooks/SKILL.md + mcp-snippet.json) so `npx skills add` can
      # read them from the source repo, and the build stamps the version into
      # README.md and docs.html. Fail if a canonical/ edit was committed without
      # re-running `npm run build` — i.e. the committed copies are stale.
      - name: Check committed build-stamped files are in sync
        run: |
          git diff --exit-code -- skills/ mcp-snippet.json README.md docs.html || {
            echo "::error::Build-stamped files are stale. Run 'npm run build' and commit the result."
            exit 1
          }
      - run: npm test
      # Validate the generated Claude Code plugin against the real schema. This is
      # the gate that catches a broken plugin layout (manifest/commands/MCP in the
      # wrong place) before it reaches a marketplace.
      - name: Validate Claude Code plugin
        run: npx -y @anthropic-ai/claude-code plugin validate dist/claude-code-plugin --strict
